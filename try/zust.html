<title>冰果英语欢迎您</title>
</head>
<body>

<div class="main_div" align="center">

<div class="link">
	<div><font><b>欢迎浙江科技学院图书馆的读者</b></font></div>

	<a href="#null" onclick="init_login()"><div id="enter_link"><font><b>5秒钟后自动进入 >></b></font></div></a>
</div>
</div>

<script type="text/javascript">

var count = 4;

window.setInterval(addTime,1000);

function addTime(){

  if(count <= 0){
    init_login();
     }
  else{    
    var html = "<font><b>" + count + "秒钟后自动进入 >></b></font>";    
    $('#enter_link').empty().append($(html));
    count = count - 1;
     }
}

function init_login(){
   var ran = Math.random();
	 var current = document.location.href;
	 var host = getHostFromURL(current);
  var url = "http://" + host + "/lib/common/initspeciallogin.xml?host=" + host + "&key=268dc26b75e1862ad819b838ab0f842e&value=-1ef523c6b645a65441a91fa80df077c2&ran=" + ran;
  $.get(url, function(data){
     var serverURL = $(data).find('server_url').text(); 
     window.open("http://" + serverURL,"_self");
      });
}
 
 	function getHostFromURL( url ) {
		var host = url.replace("http://","");
		var slash_end = host.indexOf("/");
		if( slash_end != -1 ){
			host = host.substring( 0, slash_end );
		}
		return host;
	}
	
</script>
