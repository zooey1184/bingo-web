  <!-- AOS init -->
  <script src="/js/aos.js"></script>
  <script type="module">
    AOS.init();

    const { createApp, ref, reactive, onMounted } = Vue


    const app = createApp({
      setup() {
        const state = reactive({
          showNav: false,
          topicsList: [],
          onlineInfo: {
            school: '',
            ip_valid: false,
            online: false,
            ip_string: ''
          }
        })
        const navRef = ref(null)
        async function fetchXMLtoJSON(url) {
          const res = await fetch(url);
          const xmlText = await res.text();
          const parser = new window.DOMParser();
          const xmlDoc = parser.parseFromString(xmlText, 'text/xml');

          return xmlDoc
        }

        const dealTopics = (xmlDoc) => {
          const items = Array.from(xmlDoc.querySelectorAll('topics item'));
          // 取每个item下所有字段，自动转为JSON
          return items.map(item => {
            const obj = {};
            Array.from(item.children).forEach(child => {
              obj[child.tagName] = child.textContent;
            });
            return obj;
          });
        }
        const fetchTopics = async () => {
          try {
            const text = await fetchXMLtoJSON('./ability/mock/topics.xml');
            const res = dealTopics(text);
            state.topicsList = res.map(item => {
              const pic = item.pic || '';
              return {
                id: item.id || '',
                pic: pic,
                image: pic.replace(/^\/st/, '..'),
                en_name: item.en_name || '',
                ch_long_name: item.ch_long_name || '',
                cn_long_name: item.cn_long_name || ''
              }
            });
          } catch (e) {
            state.topicsList = [];
          }
        }

        async function handleGetUserInfo() {
          try {
            const text = await fetchXMLtoJSON('./ability/mock/getuserip.xml');
            const school = text.querySelector('school');
            const online = text.querySelector('online');
            const ip_valid = text.querySelector('ip_valid');
            const ip_string = text.querySelector('ip_string');
            state.onlineInfo = {
              school: school ? school.textContent : '',
              ip_valid: ip_valid ? ip_valid.textContent === 'true' : false,
              online: online ? online.textContent === 'true' : false,
              ip_string: ip_string ? ip_string.textContent : ''
            }
            console.log('==state.onlineInfo==:\n', state.onlineInfo)
          } catch (e) {
            state.topicsList = [];
          }
        }
        onMounted(() => {
          fetchTopics();
          handleGetUserInfo()
        });

        return {
          state,
          navRef
        }
      }
    })

    import NavPane from './ability/nav.js'
    import Banner from './ability/banner.js'
    import BottomPane from './ability/bottom-pane.js'
    import LevelCard from './ability/level-card.js'
    import HeaderBar from './ability/header-bar.js'

    app.component('header-bar', HeaderBar)
    app.component('level-card', LevelCard)
    app.component('nav-pane', NavPane)
    app.component('banner', Banner)
    app.component('bottom-pane', BottomPane)
    app.mount('#app')
  </script>
  <script>
    window.bpInit()
  </script>
