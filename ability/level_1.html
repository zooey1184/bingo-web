<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>冰果英语</title>
  <!-- AOS -->
  <link rel="stylesheet" href="../css/aos.css" />
  <script src="../st/js/jquery-1.2.6.js" type="text/javascript"></script>
  <script type="text/javascript" src="../st/js/login_st.js"></script>
  <script type="text/javascript" src="../st/js/ability/level_1.js"></script>
  <!-- <script type="text/javascript" src="../st/js/index/index_ability.js"></script> -->
  <link rel="stylesheet" href="../css/ability.css">
  <link href="../css/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/atom.css" type="text/css" />
  <link rel="stylesheet" href="../css/skilline.css" />

  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <link rel="stylesheet" href="//at.alicdn.com/t/c/font_2293465_0s3sc7h6oaw9.css">
  <script src="../js/toast.js"></script>
  <link rel="stylesheet" href="../css/toast.css">
  <script src="../js/bp_init.js"></script>
</head>

<body>
  <div id="app">
    <div class="bg-cream overflow-hidden">
      <div style="max-width: 1200px; margin: 0 auto" class="pos-r navPane flex items-center flex-wrap justify-between">
        <div class="color-orange p-16 flex items-center">
          <div class="bg-orange" style="border-radius: 30px; padding: 12px;">
            <img src="../images/bingo-logo.png" style="width: 20px" alt="">
          </div>
          <div class="font-size-24 font-weight-600 ml-16">BingoEnglish</div>
        </div>

        <div class="gap-16 px-16 flex items-center font-size-16 font-weight-300">
          <nav-pane></nav-pane>
          <div>
            <button class="loginBtn">Login</button>
          </div>
        </div>
      </div>
      <div style="height: 50vh"></div>
      <nav-bottom></nav-bottom>
    </div>

    <level-type></level-type>

    <div class="flex articlePane"
      style="min-height: 50vh; max-width: 1200px; padding: 0 24px; padding-top: 48px; margin: 0 auto;">
      <div style="width: 300px" class="flex-0">
        <div v-for="item in state.topicsList" class="flex items-center menuItem">
          <img class="mr-8" :src="item.image" alt="">
          <div>
            <div class="font-size-16 font-weight-600" style="color: rgb(31, 41, 55)">{{item.en_name}}</div>
            <div class="font-size-12" style="color: rgb(107, 114, 128)">{{item.ch_long_name}}</div>
          </div>
        </div>
      </div>
      <div class="flex-1 articleContent" style="margin-left: 40px">
        <div class="abilityName">
          <div class="abilityNameContent">听力诊断</div>
          <div class="abilityNameIntro">动态诊断练习，冰果英语您对症下药</div>
        </div>
        
        <div v-for="(item, index) in state.articleList" class="flex articleItem items-center mb-16" :key="index">
          <div class="mr-16">
            <img :src="item.img" alt="">
          </div>
          <div class="ml-16">{{item.content}}</div>
        </div>
      </div>
    </div>

    <!-- 底部信息 -->
    <bottom-pane></bottom-pane>
  </div>
  <!-- ************************ script start ******************** -->
  <!-- AOS init -->
  <script src="../js/aos.js"></script>
  <script type="module">
    AOS.init();

    const { createApp, ref, reactive, onMounted } = Vue

    const app = createApp({
      setup() {
        const state = reactive({
          articleList: [
            {
              img: 'https://www.bingoenglish.com/st/onlinepic/2/1.jpg',
              content: 'Partying is fun. But have you ever been invited to a party by a foreigner? Today we are going to give you some tips about partying with foreigners. First, you should ask if it is a formal or casual '
            },
            {
              img: 'https://www.bingoenglish.com/st/onlinepic/2/2.jpg',
              content: 'Partying is fun. But have you ever been invited to a party by a foreigner? Today we are going to give you some tips about partying with foreigners. First, you should ask if it is a formal or casual '
            },
            {
              img: 'https://www.bingoenglish.com/st/onlinepic/2/3.jpg',
              content: 'Partying is fun. But have you ever been invited to a party by a foreigner? Today we are going to give you some tips about partying with foreigners. First, you should ask if it is a formal or casual '
            },
            {
              img: 'https://www.bingoenglish.com/st/onlinepic/2/4.jpg',
              content: 'Partying is fun. But have you ever been invited to a party by a foreigner? Today we are going to give you some tips about partying with foreigners. First, you should ask if it is a formal or casual '
            },
            {
              img: 'https://www.bingoenglish.com/st/onlinepic/2/1.jpg',
              content: 'Partying is fun. But have you ever been invited to a party by a foreigner? Today we are going to give you some tips about partying with foreigners. First, you should ask if it is a formal or casual '
            },
            {
              img: 'https://www.bingoenglish.com/st/onlinepic/2/1.jpg',
              content: 'Partying is fun. But have you ever been invited to a party by a foreigner? Today we are going to give you some tips about partying with foreigners. First, you should ask if it is a formal or casual '
            },
            {
              img: 'https://www.bingoenglish.com/st/onlinepic/2/1.jpg',
              content: 'Partying is fun. But have you ever been invited to a party by a foreigner? Today we are going to give you some tips about partying with foreigners. First, you should ask if it is a formal or casual '
            }
          ],
          topicsList: [],
          type: 'listening'
        })
        // 可独立调用的 fetchXMLtoJSON 工具函数
        async function fetchXMLtoJSON(url) {
          const res = await fetch(url);
          const xmlText = await res.text();
          const parser = new window.DOMParser();
          const xmlDoc = parser.parseFromString(xmlText, 'text/xml');
          const items = Array.from(xmlDoc.querySelectorAll('item'));
          // 取每个item下所有字段，自动转为JSON
          return items.map(item => {
            const obj = {};
            Array.from(item.children).forEach(child => {
              obj[child.tagName] = child.textContent;
            });
            return obj;
          });
        }

        const fetchTopics = async () => {
          try {
            const res = await fetchXMLtoJSON('./mock/topics.xml');
            state.topicsList = res.map(item => {
              const pic = item.pic || '';
              return {
                id: item.id || '',
                pic: pic,
                image: pic.replace(/^\/st/, '..'),
                en_name: item.en_name || '',
                ch_long_name: item.ch_long_name || '',
                cn_long_name: item.cn_long_name || ''
              }
            });
          } catch (e) {
            state.topicsList = [];
          }
        }

        onMounted(() => {
          fetchTopics();
        });

        return {
          state,
        }
      }
    })
    import LevelType from './level-type.js'
    import BottomPane from './bottom-pane.js'
    import NavBottom from './nav-bottom.js'
    import NavPane from './nav.js'

    app.component('level-type', LevelType)
    app.component('bottom-pane', BottomPane)
    app.component('nav-bottom', NavBottom)
    app.component('nav-pane', NavPane)
    app.mount('#app')
  </script>
  <script>
    window.bpInit()
  </script>
</body>

</html>
