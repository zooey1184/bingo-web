<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>冰果英语</title>
  <!-- AOS -->
  <link rel="stylesheet" href="../css/aos.css" />
  <script src="../st/js/jquery-1.2.6.js" type="text/javascript"></script>
  <script type="text/javascript" src="../st/js/login_st.js"></script>
  <script type="text/javascript" src="../st/js/ability/level_1.js"></script>
  <!-- <script type="text/javascript" src="../st/js/index/index_ability.js"></script> -->
  <link rel="stylesheet" href="../css/ability.css">
  <link href="../css/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/atom.css" type="text/css" />
  <link rel="stylesheet" href="../css/skilline.css" />

  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <link rel="stylesheet" href="../css/iconfont.css">
  <script src="../js/toast.js"></script>
  <link rel="stylesheet" href="../css/toast.css">
  <link rel="stylesheet" href="../css/loader.css">
  <script src="../js/bp_init.js"></script>
</head>

<body>
  <div id="app">
    <div id="toast-container"></div>
    <header-bar :size="width" :online-info="state.onlineInfo">
      <template #nav>
        <nav-pane :size="width"></nav-pane>
      </template>
      <nav-bottom></nav-bottom>
    </header-bar>

    <level-type :size="width" :type="state.type" @change="handleChangeType"></level-type>
    <div v-if="width < 980">
      <topic-menu :topics-list="state.topicsList" @pick="handlePickTopic"></topic-menu>
    </div>
    <div class="flex articlePane articlePaneWrap" >
      <div style="width: 300px" class="flex-0" v-if="width > 980">
        <div v-for="item in state.topicsList" @click="handlePickTopic(item)"
          :class="{menuItemActive: state.topic === item.id}" class="flex items-center menuItem">
          <img class="mr-8" :src="item.image" alt="">
          <div>
            <div class="font-size-16 font-weight-600" style="color: rgb(31, 41, 55)">{{item.en_name}}</div>
            <div class="font-size-12" style="color: rgb(107, 114, 128)">{{item.ch_long_name}}</div>
          </div>
        </div>
      </div>

      <div class="flex-1 articleContent pos-r">
        <div class="pos-r">
          <div v-for="(articles, index) in state.articleList">
            <div class="abilityName">
              <div class="abilityNameContent">{{articles.name}}</div>
              <div class="abilityNameIntro">{{articles.skill_type}}</div>
            </div>
            <template v-for="(item, index) in articles.items" :key="index">
              <div class=" articleItem items-center mb-16" v-if="index < 5 || articles.show">
                <div class="mr-16" :class="{'flex justify-between items-center': width < 980}">
                  <img :src="state.imagesList[index%(state.imagesList.length)]" alt="">

                  <template v-if="width < 980">
                  <div class="pl-16" v-if="state.onlineInfo.online">
                    <div class="font-size-12 color-purple text-align-center mb-4">得分: {{item.score}}</div>
                    <button class="article_btn block mb-4" @click="handleJump(item.url)">开始</button>
                    <button class="article_btn" @click="handleJump(item.redo_url)" v-if="item.finished">重试</button>
                  </div>
                  <div v-else class="ml-16">
                    <button class="article_btn" @click="handleStart">开始</button>
                  </div>
                </template>
                </div>
                <div :class="{'ml-16': width > 980}" class=" flex-1">{{item.introduction}}</div>
                <template v-if="width > 980">
                  <div class="pl-16" v-if="state.onlineInfo.online">
                    <div class="font-size-12 color-purple text-align-center mb-4">得分: {{item.score}}</div>
                    <button class="article_btn block mb-4" @click="handleJump(item.url)">开始</button>
                    <button class="article_btn" @click="handleJump(item.redo_url)" v-if="item.finished">重试</button>
                  </div>
                  <div v-else class="ml-16">
                    <button class="article_btn" @click="handleStart">开始</button>
                  </div>
                </template>
              </div>
              
            </template>
            <div class="toggleMoreBtn" v-if="articles.items.length > 5" @click="articles.show = !articles.show">{{articles.show ? '收起' : '更多'}}</div>
          </div>
        </div>
        <div v-if="state.loading" class="loadingMask">
          <div class="loading">
            <div class="pos-r" style="height: 48px; height: 48px;">
              <div class="loader"></div>
            </div>
            <span class="loadingText">加载中</span>
          </div>
        </div>
      </div>

    </div>

    <!-- 底部信息 -->
    <bottom-pane></bottom-pane>
    <div id="backToTop" class="back-to-top" @click="scrollToTop" v-show="showBackToTop">
      <span class="iconfont icon-cc-arrow-up font-size-24 font-weight-600"></span>
    </div>
  </div>
  <!-- ************************ script start ******************** -->
  <!-- AOS init -->
  <script src="../js/aos.js"></script>
  <script type="module">
    AOS.init();

    const { createApp, ref, reactive, onMounted, watch } = Vue
    import useSize from './useSize.js'
    const app = createApp({
      setup() {
        const state = reactive({
          articleList: [],
          imagesList: [],
          topicsList: [],
          loading: true,
          type: 'listening',
          topic: '2',
          bingoBand: 2,
          onlineInfo: {
            online: false,
            valid: false,
            ip_valid: false,
            school: '',
            ip_string: '',
          },
          testService: {
            1: 'ability',
            2: 'gaokao',
            3: 'cet4',
            4: 'cet6',
          }
        })
        const {width} = useSize()
        const showBackToTop = ref(false);
        const global_abilities = {
          "2": "动态诊断练习，冰果英语您对症下药",
          "5": "轻松听，多听听增强语感",
          "6": "全文听写，练基本功",
          "13": "口译，在对话情景中当英文翻译",
          "15": "跟我读，说从模仿开始",
          "16": "人机对话，根据提示在情景中学对话",
          "17": "口头作文，说上一段，让冰果英语给您专家意见",
          "21": "动态诊断练习，冰果英语为您对症下药",
          "29": "轻松读，多读才能积累语汇，增强语感",
          "81": "写写练练提高英语思维能力，冰果智能评测系统立刻评判您的写作能力",
          "2051": "句子翻译，练练翻译提高基本功",
          "2053": "句子翻译，练练翻译提高基本功",
          "2054": "句子翻译，练练翻译提高基本功",
        }
        // 可独立调用的 fetchXMLtoJSON 工具函数
        async function fetchXMLtoJSON(url) {
          const res = await fetch(url);
          const xmlText = await res.text();
          const parser = new window.DOMParser();
          const xmlDoc = parser.parseFromString(xmlText, 'text/xml');

          return xmlDoc
        }

        function handlePickTopic(item) {
          state.topic = item.id;
          console.log('==state.topic==:\n', state.topic)
          // state.imagesList = [];
        }

        const dealTopics = (xmlDoc) => {
          const items = Array.from(xmlDoc.querySelectorAll('topics item'));
          // 取每个item下所有字段，自动转为JSON
          return items.map(item => {
            const obj = {};
            Array.from(item.children).forEach(child => {
              obj[child.tagName] = child.textContent;
            });
            return obj;
          });
        }
        const fetchTopics = async () => {
          try {
            const text = await fetchXMLtoJSON('./mock/topics.xml');
            const res = dealTopics(text);
            state.topicsList = res.map(item => {
              const pic = item.pic || '';
              return {
                id: item.id || '',
                pic: pic,
                image: pic.replace(/^\/st/, '..'),
                en_name: item.en_name || '',
                ch_long_name: item.ch_long_name || '',
                cn_long_name: item.cn_long_name || ''
              }
            });
          } catch (e) {
            state.topicsList = [];
          }
        }

        const handleGetArticles = (text) => {
          const obj = {}
          const online = text.querySelector('online');
          obj.online = online ? online.textContent === 'true' : '';

          const valid = text.querySelector('valid');
          obj.valid = valid ? valid.textContent === 'true' : '';

          const ip_valid = text.querySelector('ip_valid');
          obj.ip_valid = ip_valid ? ip_valid.textContent === 'true' : '';

          const school = text.querySelector('school');
          obj.school = school ? school.textContent : '';

          const ip_string = text.querySelector('ip_string');
          obj.ip_string = ip_string ? ip_string.textContent : '';

          const todos = Array.from(text.querySelectorAll('todos todo'))

          obj.todos = todos.map(todo => {
            const todoObj = {};
            const items = []
            Array.from(todo.children).forEach((child, index) => {

              if (child.tagName === 'item') {
                const keys = Array.from(child.children)
                const _subchild = {}
                keys?.forEach(ii => {
                  _subchild[ii.tagName] = ii?.textContent === 'true' ? true : ii?.textContent === 'false' ? false : ii.textContent
                });
                items.push(_subchild)
              } else {
                if (child.tagName === 'skill_type') {
                  todoObj[child.tagName] = global_abilities[child.textContent]
                } else {
                  todoObj[child.tagName] = child.textContent === 'true' ? true : child.textContent === 'false' ? false : child.textContent;
                }
              }
            });
            todoObj.items = items
            return todoObj;
          });

          return obj
        }
        const handleFetchArticles = async ({ type, topic }) => {
          const data = {
            testService: state.testService[state.bingoBand],
            ability: type,
            topic: topic,
            bingoBand: state.bingoBand, // 1,
            ran: Math.random()
          }
          try {
            let params = new URLSearchParams(data).toString();
            state.loading = true;
            const res = await fetchXMLtoJSON('./mock/getNewAbilityMaterialsList.xml?' + params);
            const articles = handleGetArticles(res);
            state.onlineInfo = {
              online: articles?.online,
              valid: articles?.valid,
              ip_valid: articles?.ip_valid,
              school: articles?.school,
              ip_string: articles?.ip_string
            }
            state.articleList = articles?.todos
            state.loading = false;
          } catch (e) {
            state.topicsList = [];
            state.loading = false;
          }
        }

        const handleJump = (url) => {
          if (!url) {
            return;
          }
          if (url.startsWith('http')) {
            window.open(url, '_blank');
          } else {
            window.location.href = url;
          }
        }

        const handleStart = () => {
          if (!state.onlineInfo.online) {
            toast('请先登录');
            return;
          }
          if (!state.onlineInfo.valid) {
            toast('请先绑定学校');
            return;
          }
          if (!state.onlineInfo.ip_valid) {
            toast('请先绑定IP');
            return;
          }
        }

        const handleGetImages = async (topic) => {
          try {
            const res = await fetchXMLtoJSON(`./mock/topic_${topic}.xml`);
            const items = Array.from(res.querySelectorAll('pics url'));
            // 取每个item下所有字段，自动转为JSON
            const list = items.map(item => {
              return item.textContent
            });
            state.imagesList = list
          } catch (e) {
            state.topicsList = [];
          }
        }

        watch(() => state.topic, (n) => {
          handleGetImages(n)
        }, {
          immediate: true
        })

        watch(() => [state.topic, state.type], (n) => {
          handleFetchArticles({ type: n[1], topic: n[0] });
        }, {
          immediate: true
        })

        // 平滑滚动到顶部
        const scrollToTop = () => {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        function handleChangeType(type) {
          state.type = type;
        }

        onMounted(() => {
          fetchTopics();

          window.addEventListener('scroll', () => {
            showBackToTop.value = window.scrollY > 100;
          });
        });

        return {
          state,
          width,
          handleJump,
          handleStart,
          showBackToTop,
          scrollToTop,
          handleChangeType,
          handlePickTopic
        }
      }
    })
    import LevelType from './level-type.js'
    import BottomPane from './bottom-pane.js'
    import NavBottom from './nav-bottom.js'
    import NavPane from './nav-pane/index.js'
    import HeaderBar from './header-bar.js'
    import TopicMenu from './topic-menu.js'

    app.component('level-type', LevelType)
    app.component('bottom-pane', BottomPane)
    app.component('nav-bottom', NavBottom)
    app.component('nav-pane', NavPane)
    app.component('header-bar', HeaderBar)
    app.component('topic-menu', TopicMenu)
    app.mount('#app')
  </script>
  <script>
    window.bpInit()
  </script>
</body>

</html>
